{NAME}:
  amcl:
    ros__parameters:
      use_sim_time: true
      alpha1: 0.05
      alpha2: 0.05
      alpha3: 0.05
      alpha4: 0.05
      alpha5: 0.05
      base_frame_id: "{NAME}/base_footprint"
      global_frame_id: "map"
      odom_frame_id: "{NAME}/odom"
      scan_topic: /{NAME}/scan
      map_topic: /map
      first_map_only: true
      laser_model_type: "likelihood_field"
      laser_max_range: 10.0
      laser_min_range: 0.08
      max_beams: 120
      max_particles: 2000
      min_particles: 500
      sigma_hit: 0.05
      z_hit: 0.85
      z_rand: 0.05
      z_max: 0.05
      z_short: 0.05
      tf_broadcast: true
      transform_tolerance: 1.0
      update_min_a: 0.10
      update_min_d: 0.10
      set_initial_pose: true
      save_pose_rate: 0.0
      initial_pose:
        x: {X}
        y: {Y}
        z: 0.0
        yaw: {YAW}

  bt_navigator:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: "{NAME}/base_footprint"
      odom_topic: /{NAME}/wheel_odom
      bt_loop_duration: 10
      filter_duration: 0.3
      default_server_timeout: 20
      default_cancel_timeout: 50
      wait_for_service_timeout: 30000
      introspection_mode: "disabled"
      navigators: ["navigate_to_pose"]
      navigate_to_pose:
        plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
        enable_groot_monitoring: false
        groot_server_port: {GROOT_PORT}
        search_window: 2.0
      error_code_name_prefixes:
        - assisted_teleop
        - backup
        - compute_path
        - controller
        - drive_on_heading
        - follow_path
        - navigate_to_pose
        - spin
        - smoother
        - undock_robot
        - wait

  controller_server:
    ros__parameters:
      use_sim_time: true
      controller_frequency: 20.0
      costmap_update_timeout: 0.30
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      enable_stamped_cmd_vel: false
      odom_topic: /{NAME}/wheel_odom
      progress_checker_plugins: ["progress_checker"]
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]
      path_handler_plugins: ["PathHandler"]
      use_realtime_priority: false
      speed_limit_topic: "speed_limit"

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.2
        movement_time_allowance: 15.0

      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.05
        yaw_goal_tolerance: 0.08
        path_length_tolerance: 1.0

      PathHandler:
        plugin: "nav2_controller::FeasiblePathHandler"
        prune_distance: 2.0
        enforce_path_inversion: false
        enforce_path_rotation: false
        inversion_xy_tolerance: 0.2
        inversion_yaw_tolerance: 0.4
        minimum_rotation_angle: 0.785
        reject_unit_path: false

      FollowPath:
        plugin: "dwb_core::DWBLocalPlanner"
        debug_trajectory_details: true
        min_vel_x: -0.25
        min_vel_y: 0.0
        max_vel_x: 0.35
        max_vel_y: 0.0
        max_vel_theta: 3.14
        min_speed_xy: 0.0
        max_speed_xy: 0.35
        min_speed_theta: 0.0
        acc_lim_x: 2.5
        acc_lim_y: 0.0
        acc_lim_theta: 5.0
        decel_lim_x: -2.5
        decel_lim_y: 0.0
        decel_lim_theta: -5.0
        vx_samples: 20
        vy_samples: 0
        vtheta_samples: 40
        sim_time: 1.5
        linear_granularity: 0.05
        angular_granularity: 0.025
        transform_tolerance: 1.0
        xy_goal_tolerance: 0.05
        trans_stopped_velocity: 0.1
        short_circuit_trajectory_evaluation: false
        stateful: true
        critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
        BaseObstacle.scale: 0.02
        ObstacleFootprint.scale: 0.02
        PathAlign.scale: 24.0
        PathAlign.forward_point_distance: 0.1
        GoalAlign.scale: 24.0
        GoalAlign.forward_point_distance: 0.1
        PathDist.scale: 24.0
        GoalDist.scale: 24.0
        RotateToGoal.scale: 32.0
        RotateToGoal.slowing_factor: 5.0
        RotateToGoal.lookahead_time: -1.0

  planner_server:
    ros__parameters:
      use_sim_time: true
      allow_partial_planning: false
      expected_planner_frequency: 20.0
      planner_plugins: ["GridBased"]
      costmap_update_timeout: 1.0
      introspection_mode: "disabled"
      GridBased:
        plugin: "nav2_navfn_planner::NavfnPlanner"
        tolerance: 0.25
        use_astar: true
        max_cycles_factor: 10
        allow_unknown: true

  local_costmap:
    local_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 10.0
        publish_frequency: 5.0
        global_frame: "{NAME}/odom"
        robot_base_frame: "{NAME}/base_footprint"
        rolling_window: true
        width: 3
        height: 3
        resolution: 0.05
        robot_radius: 0.15
        transform_tolerance: 1.0
        plugins: ["obstacle_layer", "inflation_layer"]
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /{NAME}/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 10.0
            raytrace_min_range: 0.08
            obstacle_max_range: 8.0
            obstacle_min_range: 0.08
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.50
        always_send_full_costmap: true
        introspection_mode: "disabled"

  global_costmap:
    global_costmap:
      ros__parameters:
        use_sim_time: true
        update_frequency: 2.0
        publish_frequency: 2.0
        global_frame: map
        robot_base_frame: "{NAME}/base_footprint"
        robot_radius: 0.15
        resolution: 0.05
        track_unknown_space: true
        transform_tolerance: 1.0
        plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
        static_layer:
          plugin: "nav2_costmap_2d::StaticLayer"
          map_subscribe_transient_local: true
          enabled: true
          subscribe_to_updates: true
          transform_tolerance: 1.0
          map_topic: /map
        obstacle_layer:
          plugin: "nav2_costmap_2d::ObstacleLayer"
          enabled: true
          observation_sources: scan
          scan:
            topic: /{NAME}/scan
            max_obstacle_height: 2.0
            clearing: true
            marking: true
            data_type: "LaserScan"
            raytrace_max_range: 10.0
            raytrace_min_range: 0.08
            obstacle_max_range: 8.0
            obstacle_min_range: 0.08
        inflation_layer:
          plugin: "nav2_costmap_2d::InflationLayer"
          cost_scaling_factor: 3.0
          inflation_radius: 0.50
        always_send_full_costmap: true
        introspection_mode: "disabled"

  behavior_server:
    ros__parameters:
      use_sim_time: true
      enable_stamped_cmd_vel: false
      local_costmap_topic: local_costmap/costmap_raw
      global_costmap_topic: global_costmap/costmap_raw
      local_footprint_topic: local_costmap/published_footprint
      global_footprint_topic: global_costmap/published_footprint
      cycle_frequency: 10.0
      behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
      spin:
        plugin: "nav2_behaviors::Spin"
      backup:
        plugin: "nav2_behaviors::BackUp"
      drive_on_heading:
        plugin: "nav2_behaviors::DriveOnHeading"
      wait:
        plugin: "nav2_behaviors::Wait"
      assisted_teleop:
        plugin: "nav2_behaviors::AssistedTeleop"

  waypoint_follower:
    ros__parameters:
      use_sim_time: true
      loop_rate: 20
      stop_on_failure: false
      waypoint_task_executor_plugin: "wait_at_waypoint"
      wait_at_waypoint:
        plugin: "nav2_waypoint_follower::WaitAtWaypoint"
        enabled: true
        waypoint_pause_duration: 200

